<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sinal Fantasma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Michroma&display=swap">
<style>
/* Layout: uma coluna estreita feita para passar o celular de mão em mão. O placar das missões fica no topo de toda tela pública. Fundo de cidade à noite com grade discreta. */
:root{
  --void:#060a13;
  --deck:#0d1524;
  --panel:#111c2f;
  --line:#22314d;
  --text:#e1ebf8;
  --dim:#8196b5;
  --res:#35d4ea;
  --res-ink:#032a31;
  --spy:#ee4a3f;
  --amber:#f4b94a;
  --f-disp:'Michroma','Eurostile','Arial Black',sans-serif;
  --f-body:'Chakra Petch','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
body{
  background-color:var(--void);
  background-image:
    radial-gradient(120% 55% at 50% -8%,rgba(53,212,234,.16),transparent 62%),
    linear-gradient(rgba(130,160,210,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(130,160,210,.05) 1px,transparent 1px);
  background-size:auto,32px 32px,32px 32px;
  color:var(--text);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.45;
  padding-block:22px 76px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(24px,8.5vw,48px);line-height:1.12;letter-spacing:.03em;text-transform:uppercase}
h2{font-family:var(--f-disp);font-weight:400;font-size:clamp(17px,5.2vw,22px);line-height:1.3;letter-spacing:.02em;text-wrap:balance;overflow-wrap:anywhere}
h3{font-family:var(--f-disp);font-weight:400;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.lead{color:var(--dim);max-width:60ch}
.hl{color:var(--amber)}
.note{padding:10px 14px;border-radius:10px;border:1px solid var(--amber);color:var(--amber);font-size:14px}
.warn{padding:10px 14px;border-radius:10px;border:1px solid var(--spy);color:#ff9d95;font-size:14px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:12px 18px;border-radius:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:14px;border:1.5px solid var(--line);background:var(--panel);transition:transform .12s,background .15s,border-color .15s}
.btn:active{transform:scale(.98)}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--res);border-color:var(--res);color:var(--res-ink)}
.btn.primary:hover{background:#5fe0f1}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}

.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hero h1{background:linear-gradient(180deg,#fff 20%,#9fdcec);-webkit-background-clip:text;background-clip:text;color:transparent}

.stepper{display:grid;grid-template-columns:58px 1fr 58px;align-items:center;gap:10px}
.stepper button{height:58px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);font-size:26px;line-height:1}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper .num{font-family:var(--f-disp);font-size:44px;text-align:center;font-variant-numeric:tabular-nums}
.split{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-weight:600;font-size:14px;letter-spacing:.05em;text-transform:uppercase}
.res-t{color:var(--res)}
.spy-t{color:var(--spy)}

.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim);min-width:0}
input[type=text]{width:100%;min-height:46px;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--deck);color:var(--text);font:inherit}
input[type=text]:focus{border-color:var(--res);outline:none}
@media(max-width:380px){.names{grid-template-columns:1fr}}

.toggle{display:flex;gap:14px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--deck);cursor:pointer;position:relative}
.toggle input{position:absolute;opacity:0;width:1px;height:1px}
.toggle .sw{flex:none;width:46px;height:26px;border-radius:999px;background:var(--line);position:relative;margin-top:2px;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:transform .2s}
.toggle input:checked+.sw{background:var(--spy)}
.toggle input:checked+.sw::after{transform:translateX(20px)}
.toggle input:focus-visible+.sw{outline:2px solid var(--amber);outline-offset:3px}
.toggle strong{display:block}
.toggle small{display:block;color:var(--dim);font-size:13px;line-height:1.4;margin-top:2px}

.how{border-top:1px solid var(--line);padding-top:14px;color:var(--dim)}
.how summary{cursor:pointer;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13px;color:var(--text)}
.how p{margin-top:10px;font-size:14px}

.board{padding:16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,rgba(17,28,47,.92),rgba(13,21,36,.92));display:flex;flex-direction:column;gap:14px}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.dot{width:min(100%,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--deck);font-family:var(--f-disp);font-size:18px;color:var(--dim);font-variant-numeric:tabular-nums}
.dot svg{width:55%;height:55%}
.node.now .dot{border-color:var(--res);color:var(--text);box-shadow:0 0 0 4px rgba(53,212,234,.16),0 0 22px rgba(53,212,234,.35)}
.node.win .dot{background:var(--res);border-color:var(--res);color:var(--res-ink)}
.node.lose .dot{background:var(--spy);border-color:var(--spy);color:#fff}
.lab{font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;font-weight:600}
.dbl{font-size:10px;color:var(--amber);text-align:center;line-height:1.15}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:13px;color:var(--dim)}
.pips{display:inline-flex;gap:5px;vertical-align:middle;margin-left:6px}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--dim)}
.pip.on{background:var(--spy);border-color:var(--spy)}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:14px;min-height:58px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);min-width:0}
.pbtn .nm{overflow-wrap:anywhere;font-weight:500}
.pbtn .tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);font-weight:700;flex:none}
.pbtn.on{border-color:var(--res);background:rgba(53,212,234,.14)}
.pbtn .ck{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--res-ink)}
.pbtn.on .ck{background:var(--res);border-color:var(--res)}
.pbtn .ck svg{width:12px;height:12px;opacity:0}
.pbtn.on .ck svg{opacity:1}
.count{text-align:center;font-family:var(--f-disp);font-size:14px;letter-spacing:.08em;color:var(--dim);font-variant-numeric:tabular-nums}

.handoff{display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;padding:40px 4px 8px}
.who{font-family:var(--f-disp);font-size:clamp(26px,9vw,40px);overflow-wrap:anywhere;line-height:1.15}
.handoff .lead{max-width:34ch}

.role{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:28px 20px;border-radius:16px;border:1.5px solid}
.role.res{border-color:var(--res);color:var(--res);background:radial-gradient(90% 70% at 50% 0%,rgba(53,212,234,.2),transparent 70%),var(--panel)}
.role.spy{border-color:var(--spy);color:var(--spy);background:radial-gradient(90% 70% at 50% 0%,rgba(238,74,63,.22),transparent 70%),var(--panel)}
.role h2{font-size:clamp(19px,6vw,26px);text-transform:uppercase}
.role p{color:var(--text)}
.emb{width:92px;height:92px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 14px;border-radius:999px;border:1px solid currentColor;font-size:14px;color:var(--text);overflow-wrap:anywhere}
.role .eyebrow{color:inherit;opacity:.8}

.teamline{padding:12px 14px;border-radius:10px;background:var(--deck);border:1px solid var(--line);font-size:14px}
.teamline b{color:var(--amber);font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{min-height:160px;flex-direction:column;border-radius:14px;border:2px solid;font-family:var(--f-disp);font-size:14px;letter-spacing:.06em;background:var(--deck)}
.big svg{width:52px;height:52px}
.big.yes{border-color:var(--res);color:var(--res)}
.big.yes.sel{background:var(--res);color:var(--res-ink)}
.big.no{border-color:var(--spy);color:var(--spy)}
.big.no.sel{background:var(--spy);color:#fff}
.big:hover{border-color:currentColor}

.vtally{font-family:var(--f-disp);font-size:clamp(34px,11vw,52px);text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.vtally .a{color:var(--res)}
.vtally .r{color:var(--spy)}
.vlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--deck);border-radius:8px;border-left:4px solid;min-width:0;font-size:14px}
.vrow .nm{overflow-wrap:anywhere}
.vrow.A{border-color:var(--res)}
.vrow.R{border-color:var(--spy)}
.vrow span.v{flex:none;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.vrow.A .v{color:var(--res)}
.vrow.R .v{color:var(--spy)}

.flips{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.c3d{width:84px;height:120px;perspective:600px}
.c3d .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d}
.c3d.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;display:grid;place-items:center;border:2px solid;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.face.back{background:repeating-linear-gradient(45deg,var(--deck),var(--deck) 6px,var(--panel) 6px,var(--panel) 12px);border-color:var(--line)}
.face.front{transform:rotateY(180deg);background:var(--panel)}
.face.front.S{border-color:var(--res);color:var(--res)}
.face.front.F{border-color:var(--spy);color:var(--spy)}
.face svg{width:44px;height:44px}
.verdict{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.verdict h2{font-size:clamp(20px,6.4vw,28px);text-transform:uppercase}
.verdict.ok h2{color:var(--res)}
.verdict.bad h2{color:var(--spy)}
.verdict p{color:var(--dim)}

.banner{padding:30px 20px;border-radius:16px;border:1.5px solid;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.banner.res{border-color:var(--res);color:var(--res);background:radial-gradient(90% 80% at 50% 0%,rgba(53,212,234,.22),transparent 70%),var(--panel)}
.banner.spy{border-color:var(--spy);color:var(--spy);background:radial-gradient(90% 80% at 50% 0%,rgba(238,74,63,.24),transparent 70%),var(--panel)}
.banner p{color:var(--text)}
.banner .eyebrow{color:inherit;opacity:.8}
.roles{display:flex;flex-direction:column;gap:8px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;background:var(--deck);border-left:4px solid}
.rrow.res{border-color:var(--res)}
.rrow.spy{border-color:var(--spy)}
.rrow .nm{overflow-wrap:anywhere}
.rrow .rl{flex:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.rrow.res .rl{color:var(--res)}
.rrow.spy .rl{color:var(--spy)}
.log{display:flex;flex-direction:column;gap:10px}
.log li{padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--deck);font-size:14px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow-wrap:anywhere}
.log .dim{color:var(--dim)}
.log .okt{color:var(--res);font-weight:600}
.log .badt{color:var(--spy);font-weight:600}
.actions{display:flex;flex-direction:column;gap:10px}

.tourbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.skip{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:8px 4px;font-weight:600}
.skip:hover{color:var(--text)}
.illus{display:flex;align-items:center;justify-content:center;gap:22px;flex-wrap:wrap;min-height:190px;padding:24px 16px;border:1px solid var(--line);border-radius:16px;background:radial-gradient(90% 90% at 50% 0%,rgba(53,212,234,.1),transparent 70%),var(--deck)}
.illus .emb{width:68px;height:68px}
.ill-col{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.ill-col span{font-family:var(--f-disp);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.ill-col small{color:var(--dim);font-size:13px;max-width:30ch}
.ill-col.res{color:var(--res)}
.ill-col.spy{color:var(--spy)}
.ill-col.full{width:100%}
.ill-arrow{font-size:28px;color:var(--dim)}
.illus .vtally{font-size:46px}
.illus .track{width:100%}
.dots{display:flex;justify-content:center;gap:8px;align-items:center}
.dots i{display:block;width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--res);width:22px;border-radius:999px}
.tour .lead{color:var(--text)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;border:1px solid var(--line);border-radius:12px;background:var(--deck)}
.tab{min-height:44px;border-radius:8px;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tab.on{background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--res)}
.choice{flex-direction:column;align-items:flex-start;gap:6px;min-height:96px;text-align:left}
.choice small{font-size:13px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--dim)}
.obar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ocode{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ocode b{color:var(--text);font-family:var(--f-disp);font-weight:400;letter-spacing:.14em}
.obtns{display:flex;gap:8px}
.mini{min-height:36px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.codebox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 16px;border:1.5px dashed var(--res);border-radius:14px;background:var(--deck)}
.code{font-family:var(--f-disp);font-size:clamp(34px,13vw,54px);letter-spacing:.2em;color:var(--res);padding-left:.2em;user-select:all;-webkit-user-select:all}
.ocodeinput{text-transform:uppercase;letter-spacing:.3em;font-family:var(--f-disp);font-size:20px;text-align:center}
.or{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.fieldlab{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
@media (prefers-reduced-motion:reduce){
  .c3d .in,.btn,.toggle .sw,.toggle .sw::after{transition:none}
}

/* ===== Camada 3D ===== */
:root{--edge:#0a1120;--res-edge:#12707e;--spy-edge:#8a251e}
.emb3-wrap{display:block;position:relative;width:92px;height:92px;perspective:520px;flex:none}
.illus .emb3-wrap{width:68px;height:68px}
.emb3-wrap::after{content:"";position:absolute;left:12%;right:12%;bottom:-16px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(2px)}
.emb3{position:absolute;inset:0;display:block;transform-style:preserve-3d;animation:sway 3.6s ease-in-out infinite alternate;will-change:transform}
.emb3.res{--c:var(--res);--cd:#16626e;--ft:rgba(53,212,234,.16)}
.emb3.spy{--c:var(--spy);--cd:#7d2420;--ft:rgba(238,74,63,.18)}
.emb3 svg{position:absolute;inset:0;width:100%;height:100%;transform:translateZ(var(--z));overflow:visible;stroke:var(--cd);fill:none}
.emb3 svg .o{fill:var(--cd)}
.emb3 svg.top{stroke:var(--c);filter:drop-shadow(0 0 5px var(--c))}
.emb3 svg.top .o{fill:var(--ft)}
.emb3.spy svg circle:not(.o){fill:var(--cd)}
.emb3.spy svg.top circle:not(.o){fill:var(--c)}
@keyframes sway{from{transform:rotateX(-14deg) rotateY(-30deg)}to{transform:rotateX(-6deg) rotateY(30deg)}}

.role,.banner{position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .18s ease-out;
  box-shadow:0 1px 0 var(--edge-c),0 2px 0 var(--edge-c),0 3px 0 var(--edge-c),0 4px 0 var(--edge-c),0 5px 0 var(--edge-c),0 6px 0 var(--edge-c),0 22px 34px rgba(0,0,0,.55)}
.role.res,.banner.res{--edge-c:var(--res-edge)}
.role.spy,.banner.spy{--edge-c:var(--spy-edge)}
.role>.emb3-wrap,.banner>.emb3-wrap{transform:translateZ(44px)}
.role>h2,.banner>h2{transform:translateZ(26px)}
.role::after,.banner::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(60% 50% at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.14),transparent 70%)}

/* botões como teclas */
.btn{box-shadow:0 4px 0 var(--edge),0 9px 14px rgba(0,0,0,.35);transform:translateY(0)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--edge),0 11px 16px rgba(0,0,0,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge),0 2px 4px rgba(0,0,0,.4)}
.btn.primary{background:linear-gradient(180deg,#7be9f8,#35d4ea 60%);box-shadow:0 4px 0 var(--res-edge),0 10px 18px rgba(53,212,234,.28)}
.btn.primary:hover{background:linear-gradient(180deg,#9af0fb,#4adcf0 60%);box-shadow:0 5px 0 var(--res-edge),0 12px 20px rgba(53,212,234,.3)}
.btn.primary:active{box-shadow:0 0 0 var(--res-edge),0 2px 5px rgba(53,212,234,.3)}
.btn:disabled,.btn:disabled:hover,.btn:disabled:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge)}
.pair{margin-bottom:10px}
.big{transform:perspective(520px) rotateX(10deg);transform-origin:50% 100%;box-shadow:0 8px 0 var(--edge),0 16px 22px rgba(0,0,0,.4);transition:transform .12s,box-shadow .12s,background .15s;position:relative}
.big::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%);pointer-events:none}
.big.yes{box-shadow:0 8px 0 var(--res-edge),0 16px 22px rgba(0,0,0,.4)}
.big.no{box-shadow:0 8px 0 var(--spy-edge),0 16px 22px rgba(0,0,0,.4)}
.big svg{filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
.big:hover{transform:perspective(520px) rotateX(6deg) translateY(-2px)}
.big:active,.big.sel{transform:perspective(520px) rotateX(0deg) translateY(6px)}
.big.yes:active,.big.yes.sel{box-shadow:0 2px 0 var(--res-edge),0 4px 8px rgba(0,0,0,.4)}
.big.no:active,.big.no.sel{box-shadow:0 2px 0 var(--spy-edge),0 4px 8px rgba(0,0,0,.4)}
.pbtn,.stepper button,.mini{box-shadow:0 3px 0 var(--edge),0 6px 10px rgba(0,0,0,.3);transition:transform .1s,box-shadow .1s,background .15s,border-color .15s}
.pbtn:active,.stepper button:active:not(:disabled),.mini:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.pbtn.on{transform:translateY(3px);box-shadow:0 0 0 var(--edge),0 0 16px rgba(53,212,234,.25)}
.stepper button:disabled{box-shadow:none}
.tab.on{box-shadow:inset 0 0 0 1.5px var(--res),0 3px 0 var(--edge)}
.pbtn .ck{background:radial-gradient(circle at 35% 30%,#1c2c47,var(--deck))}
.pbtn.on .ck{background:radial-gradient(circle at 35% 30%,#9cf1fb,var(--res))}
.teamline,.vrow,.rrow,.log li,.toggle,.codebox,input[type=text]{box-shadow:0 2px 0 var(--edge),0 6px 10px rgba(0,0,0,.25)}
.toggle .sw::after{background:radial-gradient(circle at 35% 30%,#fff,#b9c9e2);box-shadow:0 2px 3px rgba(0,0,0,.5)}

/* placar: moedas sobre um tabuleiro inclinado */
.board{perspective:760px;box-shadow:0 1px 0 #17233b,0 2px 0 #152036,0 3px 0 #121c30,0 4px 0 #0f1829,0 5px 0 #0c1424,0 18px 28px rgba(0,0,0,.5)}
.track{transform:rotateX(18deg);transform-origin:50% 90%;transform-style:preserve-3d;padding-bottom:8px}
.dot{transform:translateZ(8px);border:2px solid #2c4166;background:radial-gradient(circle at 34% 26%,#2b4068,var(--deck) 66%);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.18),inset 0 -4px 6px rgba(0,0,0,.5),0 1px 0 #1a2740,0 2px 0 #162137,0 3px 0 #121b2e,0 4px 0 #0e1626,0 5px 0 #0a1120,0 14px 14px rgba(0,0,0,.5)}
.node.now .dot{transform:translateZ(18px);box-shadow:inset 0 2px 3px rgba(255,255,255,.2),inset 0 -4px 6px rgba(0,0,0,.5),0 1px 0 #0f5d69,0 2px 0 #0f5d69,0 3px 0 #0d4f59,0 4px 0 #0b434c,0 5px 0 #09363d,0 0 0 4px rgba(53,212,234,.16),0 0 24px rgba(53,212,234,.45),0 20px 16px rgba(0,0,0,.45)}
.node.win .dot{background:radial-gradient(circle at 34% 26%,#b7f6ff,var(--res) 58%,#1796a8);box-shadow:inset 0 2px 3px rgba(255,255,255,.5),inset 0 -4px 6px rgba(0,30,40,.4),0 1px 0 #12707e,0 2px 0 #11697a,0 3px 0 #0f6170,0 4px 0 #0d5865,0 5px 0 #0b4e5a,0 14px 14px rgba(0,0,0,.5)}
.node.lose .dot{background:radial-gradient(circle at 34% 26%,#ffb0a9,var(--spy) 58%,#a82a22);box-shadow:inset 0 2px 3px rgba(255,255,255,.4),inset 0 -4px 6px rgba(50,0,0,.4),0 1px 0 #8a251e,0 2px 0 #7f221b,0 3px 0 #741f19,0 4px 0 #691c16,0 5px 0 #5d1913,0 14px 14px rgba(0,0,0,.5)}
.node.win .dot svg,.node.lose .dot svg{filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.pip{background:radial-gradient(circle at 35% 30%,#2a3b5c,var(--deck));box-shadow:0 2px 0 var(--edge)}
.pip.on{background:radial-gradient(circle at 35% 30%,#ffb0a9,var(--spy) 60%,#a82a22)}

/* cartas de missão com espessura */
.c3d{position:relative;width:88px;height:124px;perspective:700px}
.c3d::after{content:"";position:absolute;left:8%;right:8%;bottom:-18px;height:14px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);filter:blur(2px)}
.c3d .in{transform:rotateX(-10deg) rotateY(-12deg);transition:transform .8s cubic-bezier(.3,.7,.2,1)}
.c3d.up .in{transform:rotateX(-10deg) rotateY(168deg)}
.c3d .sl{position:absolute;inset:0;border-radius:10px;background:#2a3c5e;pointer-events:none}
.c3d .sl:nth-child(1){transform:translateZ(-1.5px)}
.c3d .sl:nth-child(2){transform:translateZ(-.5px)}
.c3d .sl:nth-child(3){transform:translateZ(.5px)}
.c3d .sl:nth-child(4){transform:translateZ(1.5px)}
.face.back{transform:translateZ(2.5px);background:radial-gradient(circle at 50% 50%,rgba(53,212,234,.18),transparent 55%),repeating-linear-gradient(45deg,var(--deck),var(--deck) 6px,var(--panel) 6px,var(--panel) 12px)}
.face.front{transform:rotateY(180deg) translateZ(2.5px);background:linear-gradient(135deg,rgba(255,255,255,.1),transparent 40%),var(--panel)}
.face.front.S{box-shadow:inset 0 0 18px rgba(53,212,234,.25)}
.face.front.F{box-shadow:inset 0 0 18px rgba(238,74,63,.28)}
.face.front svg{filter:drop-shadow(0 0 6px currentColor)}

/* textos com relevo */
.who{text-shadow:0 1px 0 #1d2d4d,0 2px 0 #172540,0 3px 0 #111c33,0 10px 16px rgba(0,0,0,.55)}
h1{filter:drop-shadow(0 2px 0 #0b3b47) drop-shadow(0 3px 0 #08303a) drop-shadow(0 12px 14px rgba(0,0,0,.5))}
.code{text-shadow:0 1px 0 #12707e,0 2px 0 #0f5f6c,0 3px 0 #0c4f5a,0 12px 18px rgba(0,0,0,.5)}
.vtally{text-shadow:0 2px 0 rgba(0,0,0,.45),0 3px 0 rgba(0,0,0,.35),0 10px 16px rgba(0,0,0,.45)}
.illus{perspective:700px;box-shadow:0 3px 0 var(--edge),0 12px 22px rgba(0,0,0,.35)}

h1{overflow-wrap:anywhere}
.illus{gap:18px}
.ill-col{flex:0 1 auto;margin-inline:auto}
.illus .emb3-wrap{margin-bottom:12px}
@media (prefers-reduced-motion:reduce){
  .emb3{animation:none;transform:rotateX(-10deg) rotateY(-20deg)}
  .role,.banner,.btn,.big,.pbtn,.c3d .in{transition:none}
}

#mus{position:fixed;z-index:20;bottom:16px;right:max(16px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--res);border:1.5px solid var(--line);background:radial-gradient(circle at 35% 30%,#1c2c47,var(--deck));box-shadow:0 3px 0 var(--edge),0 8px 14px rgba(0,0,0,.45);opacity:.92;transition:transform .1s,box-shadow .1s}
#mus:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
#mus svg{width:22px;height:22px}
#mus.off{color:var(--dim)}

.story{position:relative;padding:14px 16px 14px 18px;border-radius:12px;background:linear-gradient(180deg,rgba(244,185,74,.1),rgba(244,185,74,.03)),var(--deck);border:1px solid rgba(244,185,74,.35);display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 var(--edge),0 10px 16px rgba(0,0,0,.3)}
.story::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--amber)}
.story .eyebrow{color:var(--amber)}
.story p:not(.eyebrow){font-size:15px;line-height:1.5}
.story .story-pro{color:var(--dim);font-style:italic}
.verdict .story-out,.story-out{font-style:italic;color:var(--text);padding:10px 14px;border-left:3px solid currentColor;border-radius:4px;text-align:left}
.verdict.ok .story-out{border-color:var(--res)}
.verdict.bad .story-out{border-color:var(--spy)}
.story-end{font-style:italic;color:var(--text);opacity:.9;max-width:38ch}

/* logo com glitch */
h1.glitch{background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--text);filter:drop-shadow(0 3px 0 #0b3b47) drop-shadow(0 12px 14px rgba(0,0,0,.5))}
h1.glitch span{display:block;position:relative;width:max-content;max-width:100%;background:linear-gradient(180deg,#fff 20%,#9fdcec);-webkit-background-clip:text;background-clip:text;color:transparent}
h1.glitch span::before,h1.glitch span::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;background:none;-webkit-background-clip:border-box;background-clip:border-box;overflow:hidden;opacity:0}
h1.glitch span::before{color:var(--res);text-shadow:none;animation:glA 3.4s infinite steps(1)}
h1.glitch span::after{color:var(--spy);animation:glB 3.4s infinite steps(1)}
h1.glitch span:nth-child(2)::before{animation-delay:-.7s}
h1.glitch span:nth-child(2)::after{animation-delay:-.7s}
@keyframes glA{0%,86%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0)}87%{opacity:1;transform:translate(-4px,1px);clip-path:inset(10% 0 62% 0)}90%{opacity:1;transform:translate(3px,-1px);clip-path:inset(54% 0 18% 0)}93%{opacity:1;transform:translate(-2px,0);clip-path:inset(30% 0 40% 0)}96%{opacity:0}}
@keyframes glB{0%,87%,100%{opacity:0;transform:none;clip-path:inset(0 0 0 0)}88%{opacity:1;transform:translate(4px,-1px);clip-path:inset(60% 0 8% 0)}91%{opacity:1;transform:translate(-3px,1px);clip-path:inset(6% 0 70% 0)}94%{opacity:1;transform:translate(2px,0);clip-path:inset(42% 0 30% 0)}97%{opacity:0}}
h1.glitch span:first-child{animation:glJ 3.4s infinite steps(1)}
@keyframes glJ{0%,88%,100%{transform:none}89%{transform:translateX(2px)}92%{transform:translateX(-2px)}95%{transform:none}}

/* abertura */
.scene{position:relative;height:auto;aspect-ratio:72/67;border-radius:16px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;color:var(--res);background:radial-gradient(90% 90% at 50% 100%,rgba(53,212,234,.2),transparent 70%),#070d18;box-shadow:0 4px 0 var(--edge),0 16px 24px rgba(0,0,0,.45)}
.scene::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);animation:flick 5s infinite steps(1)}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:.9}}
.scene .sky{position:absolute;inset:0;width:100%;height:100%}
.sky .win{fill:var(--amber);opacity:.85;animation:blink 4s infinite steps(1)}
.sky .win.w1{fill:var(--res)}
.sky .win:nth-child(3n){animation-delay:-1.3s}
.sky .win:nth-child(5n){animation-delay:-2.6s}
@keyframes blink{0%,90%,100%{opacity:.85}93%{opacity:.15}}
.sky .eye{animation:eye 2.4s ease-in-out infinite;filter:drop-shadow(0 0 6px #ee4a3f)}
@keyframes eye{50%{opacity:.35}}
.bcast{width:150px;height:140px;filter:drop-shadow(0 0 8px currentColor)}
.bcast .a1{animation:arc 2.2s infinite steps(1)}.bcast .a2{animation:arc 2.2s .35s infinite steps(1)}.bcast .a3{animation:arc 2.2s .7s infinite steps(1)}
@keyframes arc{0%,60%{opacity:1}70%{opacity:.1}85%{opacity:.8}100%{opacity:.1}}
.pulse{position:absolute;inset:0;display:grid;place-items:center}
.pulse i{position:absolute;width:90px;height:90px;border-radius:50%;border:2px solid var(--res);opacity:0;animation:ring 3s ease-out infinite}
.pulse i:nth-child(2){animation-delay:1s}.pulse i:nth-child(3){animation-delay:2s}
@keyframes ring{0%{transform:scale(.6);opacity:.8}100%{transform:scale(2.6);opacity:0}}
.duo{display:flex;gap:34px;align-items:center}
.duo .emb3.spy{--c:var(--spy)}
.gspy{display:block}
@keyframes gshake{0%,90%,100%{transform:none}91%{transform:translate(-4px,1px) skewX(6deg)}93%{transform:translate(4px,-1px) skewX(-6deg)}95%{transform:none}}
.scene .track{position:relative;z-index:1;width:min(100%,340px);padding:0 12px;transform:none}
.scene .dot{transform:none}
.lines{display:flex;flex-direction:column;gap:12px;min-height:150px}
.lines h2{font-size:clamp(18px,5.6vw,24px);text-transform:none;line-height:1.35}
.lines h2,.lines p{opacity:0;animation:rise .9s ease forwards;animation-delay:var(--d,0s)}
.lines p{color:var(--text);opacity:0}
@keyframes rise{from{opacity:0;transform:translateY(10px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){
  h1.glitch span,h1.glitch span::before,h1.glitch span::after,.sky .win,.sky .eye,.bcast path,.pulse i,.gspy,.scene::after{animation:none}
  .lines h2,.lines p{animation:none;opacity:1}
}

.story .story-link{padding-left:10px;border-left:3px solid var(--res);color:var(--text)}
.story .story-link.bad{border-color:var(--spy)}

.scene.s0{height:auto;aspect-ratio:72/67}
.scene .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene.s0 .sky{opacity:0}
.scene.s0.fb .sky{opacity:1}
.scene.s0.fb .vid{display:none}

/* ===== modo computador: telas largas usam duas colunas ===== */
@media (min-width:900px){
  body{padding-block:36px 90px}
  .wrap{max-width:660px}
  .wrap:has(>.board,>.hero,>.scene,>.illus){max-width:1120px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);column-gap:56px;row-gap:0;align-items:start}
  .wrap:has(>.board,>.hero,>.scene,>.illus)>*{grid-column:2;margin-bottom:22px;min-width:0}
  .wrap:has(>.board,>.hero,>.scene,>.illus)>.board,
  .wrap:has(>.board,>.hero,>.scene,>.illus)>.hero,
  .wrap:has(>.board,>.hero,>.scene,>.illus)>.scene,
  .wrap:has(>.board,>.hero,>.scene,>.illus)>.illus{grid-column:1;grid-row:1/span 30;position:sticky;top:28px;align-self:start}
  .wrap:has(>.tourbar)>.scene,.wrap:has(>.tourbar)>.illus,.wrap:has(>.obar)>.board{grid-row:2/span 30}
  .wrap:has(>.board,>.hero,>.scene,>.illus)>.tourbar,.wrap:has(>.board,>.hero,>.scene,>.illus)>.obar{grid-column:1/-1}
  h1{font-size:clamp(40px,4.4vw,62px)}
  h2{font-size:clamp(20px,1.9vw,26px)}
  .lead{font-size:17px}
  .emb3-wrap{width:120px;height:120px}
  .illus .emb3-wrap{width:92px;height:92px}
  .c3d{width:104px;height:148px}
  .dot{width:min(100%,70px);font-size:22px}
  .lines h2{font-size:clamp(22px,2.2vw,30px)}
  .lines{min-height:0}
  .big{min-height:190px}
  .illus{min-height:300px}
  .btn{min-height:58px;font-size:15px}
  .role,.banner{padding:40px 32px}
  #mus{bottom:24px;right:28px}
}

/* título sempre inteiro: o tamanho acompanha a largura da coluna */
.hero{container-type:inline-size}
.hero h1.glitch{font-size:clamp(24px,10cqw,62px);overflow-wrap:normal;word-break:normal}
.hero h1.glitch span{white-space:nowrap}

/* ===== telas de início (escolha de modo, No mesmo aparelho, Online local): escala tipográfica e layout =====
   Escala: título do jogo (único elemento grande) > número de jogadores (destaque médio) > título de seção > texto de apoio > rótulo > campo. */
:root{
  --fs-title:clamp(28px,11.6cqw,84px);
  --fs-count:clamp(40px,1vw + 36px,48px);
  --fs-section:clamp(14px,.1vw + 13.6px,15.5px);
  --fs-body:clamp(13px,.2vw + 12.2px,15px);
  --fs-label:clamp(12px,.1vw + 11.6px,13px);
  --fs-field:clamp(13px,.1vw + 12.6px,14px);
  --btn-step:50px;
}
.setup .hero h1.glitch{font-size:var(--fs-title)}
.setup .eyebrow{font-size:var(--fs-section)}
.setup .lead,.setup .warn,.setup .toggle strong,.setup .toggle small,.setup .choice small{font-size:var(--fs-body)}
.setup .split,.setup .fieldlab,.setup .or,.setup .skip,.setup .names label{font-size:var(--fs-label)}
.setup input[type=text]{font-size:var(--fs-field)}
.setup .ocodeinput{font-size:20px}
.setup .stepper{grid-template-columns:var(--btn-step) 1fr var(--btn-step)}
.setup .stepper button{height:var(--btn-step);font-size:22px}
.setup .stepper .num{font-size:var(--fs-count)}
.setup .choice strong{font-size:var(--fs-section)}
body:has(.wrap.home){min-height:0}
/* escolha de modo, celular: título no alto, cartões ocupam o resto da altura (100dvh) */
.wrap.home{min-height:calc(100vh - 114px);min-height:calc(100dvh - 114px)}
.wrap.home .stack{flex:1;gap:20px}
.wrap.home .choice{flex:1;min-height:120px;padding:22px;justify-content:center}
/* tablet e computador: coluna de ~720px centralizada, cartões lado a lado e do mesmo tamanho */
@media (min-width:700px){
  .wrap.setup{max-width:720px}
  .wrap.home{justify-content:center;gap:56px}
  .wrap.home .stack{flex:none;flex-direction:row;gap:24px}
  .wrap.home .choice{min-height:clamp(170px,22dvh,240px);padding:28px}
}
@media (min-width:900px){
  /* coluna única centralizada, com espaços maiores */
  .wrap.setup{display:flex;flex-direction:column;align-items:stretch;gap:32px;max-width:720px}
  .wrap.setup>*{margin-bottom:0}
  .wrap.setup>.hero{position:static;top:auto;align-self:stretch}
  .wrap.setup .stack{gap:14px}
  .wrap.setup .names{gap:14px}
  .wrap.setup input[type=text]{min-height:52px;padding:12px 14px}
  .wrap.setup .toggle{padding:18px}
  .wrap.home{min-height:calc(100vh - 142px);min-height:calc(100dvh - 142px)}
  .wrap.home .stack{gap:28px}
}

/* cenas 2 a 5: fundo com a mesma cidade do vídeo, em cores diferentes */
.scene>*{position:relative;z-index:1}
.scene>.vid,.scene>.sky,.scene>.pulse,.scene>.beam{position:absolute;z-index:0}
.scene::before{content:"";position:absolute;inset:0;z-index:0;opacity:0;background:linear-gradient(180deg,rgba(6,10,19,.25),rgba(6,10,19,.8)),url(media/abertura.jpg) center 45%/cover}
.scene.s1::before,.scene.s2::before,.scene.s3::before,.scene.s4::before{opacity:1}
.scene.s1::before{filter:sepia(1) hue-rotate(-52deg) saturate(2.4) brightness(.55)}
.scene.s2::before{filter:brightness(.7) saturate(1.3)}
.scene.s3::before{filter:hue-rotate(-18deg) saturate(1.2) brightness(.55)}
.scene.s4::before{filter:brightness(.55) saturate(1.4)}
.scene .bcast{width:62%;max-width:300px;height:auto;filter:drop-shadow(0 0 10px currentColor)}
.scene.s1{align-content:center;gap:6px}
.nosig{font-family:var(--f-disp);font-size:clamp(12px,3.4vw,16px);letter-spacing:.3em;color:var(--spy);text-shadow:0 0 10px rgba(238,74,63,.7);animation:nosig 2.6s infinite steps(1)}
@keyframes nosig{0%,70%,100%{opacity:1;transform:none}74%{opacity:.2;transform:translateX(3px)}78%{opacity:1;transform:translateX(-3px)}82%{opacity:.4}86%{opacity:1;transform:none}}
.beam{position:absolute;left:50%;bottom:0;width:70px;height:100%;transform:translateX(-50%);z-index:0;background:linear-gradient(0deg,rgba(53,212,234,.55),rgba(53,212,234,.12) 55%,transparent);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);animation:beam 3s ease-in-out infinite}
.beam.b2{width:46%;opacity:.7}
@keyframes beam{50%{opacity:.55}}
.scene.s3 .duo{filter:drop-shadow(0 8px 14px rgba(0,0,0,.6))}
@media (prefers-reduced-motion:reduce){.nosig,.beam{animation:none}}

/* tutorial: todas as ilustrações com o mesmo tamanho */
.illus{height:270px;min-height:0;align-content:center}
.illus:has(.ill-arrow){flex-wrap:nowrap;gap:6px}
.illus:has(.ill-arrow) .ill-col{flex:1 1 0;min-width:0}
.illus:has(.ill-arrow) .ill-col span{font-size:12px}
.illus:has(.ill-arrow) .ill-col small{font-size:12px}
.ill-arrow{flex:none;font-size:24px}
@media (min-width:900px){.illus{height:380px;min-height:0}}
.illus .flips{flex-wrap:nowrap;gap:8px}
.illus .c3d{width:76px;height:108px}
@media (min-width:900px){.illus .c3d{width:96px;height:136px}}
.illus .vtally span{font-size:inherit;letter-spacing:0;text-transform:none}
.illus .vtally{font-size:54px}
.emb3-wrap:has(.emb3.spy){animation:spyGl 3.2s infinite steps(1)}
@keyframes spyGl{0%,80%,100%{translate:0 0;filter:none}81%{translate:-4px 1px;filter:drop-shadow(5px 0 0 rgba(53,212,234,.85)) drop-shadow(-5px 0 0 rgba(255,60,60,.9))}83%{translate:5px -1px;filter:drop-shadow(-6px 0 0 rgba(53,212,234,.85)) drop-shadow(6px 0 0 rgba(255,60,60,.9)) brightness(1.4)}85%{translate:-2px 0;filter:hue-rotate(40deg) drop-shadow(3px 0 0 rgba(53,212,234,.8))}87%{translate:3px 1px;filter:drop-shadow(-4px 0 0 rgba(255,60,60,.9)) brightness(1.2)}89%{translate:0 0;filter:none}93%{translate:2px 0;filter:drop-shadow(3px 0 0 rgba(53,212,234,.8))}94%{translate:0 0;filter:none}}
@media (prefers-reduced-motion:reduce){.emb3-wrap:has(.emb3.spy){animation:none}}

/* ===== efeitos temáticos: botões, missão, fim de jogo ===== */
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);transform:skewX(-20deg);opacity:0;pointer-events:none}
.btn:not(:disabled):hover::after{animation:sweep .7s ease-out}
.btn.primary:not(:disabled)::after{animation:sweep 5.2s ease-in-out 1.2s infinite}
.btn.primary:not(:disabled):hover::after{animation:sweep .7s ease-out}
@keyframes sweep{0%{left:-60%;opacity:0}8%{opacity:1}30%{left:130%;opacity:1}31%,100%{left:130%;opacity:0}}
.btn:focus-visible,.big:focus-visible{outline:2px solid var(--res);outline-offset:3px}
.rip{position:absolute;border-radius:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid var(--res);pointer-events:none;animation:rip .6s ease-out forwards;z-index:2}
.btn:not(.primary) .rip{border-color:var(--dim)}
.big.no .rip{border-color:var(--spy)}
.btn.primary .rip{border-color:#fff}
@keyframes rip{0%{transform:scale(1);opacity:.9}100%{transform:scale(26);opacity:0}}
.big{overflow:hidden}

/* Emblemas em 3D: o desenho é empilhado em 9 camadas com profundidade, o que cria um relevo de verdade que gira devagar. */
var EMB_SHAPES={
  res:{o:'<path class="o" d="M32 4 60 32 32 60 4 32Z"/>',i:'<path d="M22 35 32 22 42 35"/><path d="M22 46 32 33 42 46"/>'},
  spy:{o:'<circle class="o" cx="32" cy="32" r="27"/>',i:'<path d="M32 15 49 46H15Z"/><circle cx="32" cy="37" r="3"/>'}
};

  var sh=EMB_SHAPES[k],L='',n=9,i;
  for(i=0;i<n;i++){
    L+='<svg class="L'+(i===n-1?' top':'')+'" style="--z:'+((i-(n-1)/2)*2.2).toFixed(1)+'px" viewBox="0 0 64 64" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+sh.o+sh.i+'</svg>';

Object.defineProperty(EMB,'res',{enumerable:true,get:function(){return emb3('res');}});
Object.defineProperty(EMB,'spy',{enumerable:true,get:function(){return emb3('spy');}});

(function(){var a=codePool();for(var i=0;i<10;i++)cfg.names.push(a[i]);})();

function boardCtx(x,showMeta){
  var t=TEAMS[x.n];

    var r=x.results[i],c='node',inner=sz;

}

/* ---------- Supabase (modo online fora do Claude) ----------
   Imita a interface de banco usada pelo jogo: doc(path).get/set/delete/onSnapshot e collection(path).get/onSnapshot/doc(id).
   Tabela única public.docs(path, game, data). Veja supabase/schema.sql. */
function makeSupabaseDb(url,key){
  var sb=window.supabase.createClient(url,key,{auth:{persistSession:false}});
  var chans={};
  function gameOf(path){return String(path).split('/')[1]||'';}
  function mkDoc(path,row){return {id:path.split('/').pop(),exists:!!row,data:function(){return row?JSON.parse(JSON.stringify(row.data)):undefined;}};}
  function getDoc(path){
    return sb.from('docs').select('path,data').eq('path',path).maybeSingle().then(function(r){
      if(r.error)throw r.error;return mkDoc(path,r.data);
    });
  }
  function getCol(path){
    return sb.from('docs').select('path,data').like('path',path+'/%').then(function(r){
      if(r.error)throw r.error;
      var depth=path.split('/').length+1;
      var docs=(r.data||[]).filter(function(x){return x.path.split('/').length===depth;}).map(function(x){return mkDoc(x.path,x);});
      return {docs:docs,size:docs.length,forEach:function(f){docs.forEach(f);}};
    });
  }
  function listen(path,fetcher,cb,errCb){
    var game=gameOf(path),dead=false,busy=false,again=false;
    function run(){
      if(dead)return;
      if(busy){again=true;return;}
      busy=true;
      fetcher().then(function(snap){if(!dead)cb(snap);},function(e){if(!dead&&errCb)errCb(e);}).then(function(){busy=false;if(again){again=false;run();}});
    }
    var c=chans[game];
    if(!c){
      c={ls:[],ch:null};
      c.ch=sb.channel('game-'+game).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'game=eq.'+game},function(p){
        var row=p.new&&p.new.path?p.new:p.old;
        var pa=row&&row.path?row.path:'';
        c.ls.slice().forEach(function(l){if(!pa||pa===l.path||pa.indexOf(l.path+'/')===0)l.run();});
      }).subscribe();
      chans[game]=c;
    }
    var item={path:path,run:run};
    c.ls.push(item);
    var poll=setInterval(run,6000); /* segurança: se um evento em tempo real se perder */
    run();
    return function(){
      dead=true;clearInterval(poll);
      var i=c.ls.indexOf(item);if(i>=0)c.ls.splice(i,1);
      if(!c.ls.length&&chans[game]===c){delete chans[game];try{sb.removeChannel(c.ch);}catch(e){}}
    };
  }
  function doc(path){
    return {
      get:function(){return getDoc(path);},
      set:function(obj){
        return sb.from('docs').upsert({path:path,game:gameOf(path),data:obj,updated_at:new Date().toISOString()}).then(function(r){if(r.error)throw r.error;});
      },
      delete:function(){return sb.from('docs').delete().eq('path',path).then(function(r){if(r.error)throw r.error;});},
      onSnapshot:function(cb,err){return listen(path,function(){return getDoc(path);},cb,err);}
    };
  }
  function collection(path){
    return {
      get:function(){return getCol(path);},
      doc:function(id){return doc(path+'/'+id);},
      onSnapshot:function(cb,err){return listen(path,function(){return getCol(path);},cb,err);}
    };
  }
  return {doc:doc,collection:collection};
}
function localUserId(){
  var id='';
  try{id=localStorage.getItem('rd_uid')||'';}catch(e){}
  if(!id){id=rnd(16,LOW);try{localStorage.setItem('rd_uid',id);}catch(e){}}
  return id;
}
function initOnline(){
  if(!window.claude||!window.claude.use){
    var cf=window.SINAL_CONFIG||{};
    if(cf.supabaseUrl&&cf.supabaseKey&&window.supabase){
      try{OL.db=makeSupabaseDb(cf.supabaseUrl,cf.supabaseKey);OL.id=localUserId();OL.status='ok';}catch(e){OL.status='unavailable';}
    }else OL.status='unavailable';
    return Promise.resolve();
  }
  return Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    OL.db=r[0];OL.user=r[1];
    if(!OL.db||!OL.user){OL.status='unavailable';return null;}
    return Promise.all([OL.user.id(),OL.user.can('data.write')]);
  }).then(function(r){
    if(!r)return;
    OL.id=r[0];
    if(!OL.id)OL.status='unavailable';
    else if(r[1]===false)OL.status='readonly';
    else OL.status='ok';
  }).catch(function(){OL.status='unavailable';});
}
function afterInit(){
  var saved='';
  try{saved=localStorage.getItem('rd_code')||'';}catch(e){}
  if(OL.status==='ok'&&saved&&!O&&!G){
    O={ready:false,connecting:true};
    mode='online';
    render();
    joinGame(saved,OL.name,true);
  }else softRender();
}

function oFail(msg){
  OL.busy=false;O=null;OL.msg=msg;
  try{localStorage.removeItem('rd_code');}catch(e){}
  softRender();
}
function createGame(name){
  OL.busy=true;
  var code=null,tries=0;
  function attempt(){
    code=rnd(5,ALPHA);
    return OL.db.doc('games/'+code).get().then(function(s){
      if(s.exists){tries++;if(tries>6)throw {msg:'Sinal perdido ao criar a partida. Tente de novo.'};return attempt();}
    });
  }
  return attempt().then(function(){
    return OL.db.doc('games/'+code).set({code:code,hostId:OL.id,phase:'lobby',assassin:false,story:cfg.story,gid:'',created:Date.now(),players:[],mission:0,attempt:0,rejects:0,leader:0,results:[],team:[],log:[],vres:null,mres:null,endInfo:null});
  }).then(function(){
    return OL.db.doc('games/'+code+'/players/'+OL.id).set({id:OL.id,name:name,joined:Date.now()});
  }).then(function(){
    OL.busy=false;openSession(code,true);
  }).catch(function(e){oFail((e&&e.msg)||'Sinal perdido ao criar a partida. Confira se você tem acesso de edição ao jogo.');});
}
function joinGame(code,name,resume){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length!==5){OL.msg='Digite o código de 5 letras ou números.';softRender();return Promise.resolve();}
  OL.busy=true;
  return OL.db.doc('games/'+code).get().then(function(s){
    if(!s.exists)throw {msg:'Nenhum sinal com esse código. Confira e tente de novo.'};
    var g=s.data();
    var pd=OL.db.doc('games/'+code+'/players/'+OL.id);
    return pd.get().then(function(ps){
      if(ps.exists)return g;
      if(g.phase!=='lobby')throw {msg:'Essa partida já começou.'};
      return OL.db.collection('games/'+code+'/players').get().then(function(q){
        if(q.size>=10)throw {msg:'A partida já tem 10 jogadores.'};
        return pd.set({id:OL.id,name:name,joined:Date.now()}).then(function(){return g;});
      });
    });
  }).then(function(g){
    OL.busy=false;openSession(code,g.hostId===OL.id);
  }).catch(function(e){oFail((e&&e.msg)||'Sinal perdido ao entrar na partida. Tente de novo.');});
}

function openSession(code,isHost){
  O={code:code,isHost:isHost,ready:false,game:null,players:[],intents:{},cards:[],allRoles:null,myRole:null,
     unsubs:[],busy:false,sending:false,retries:0,showRole:false,seenGid:null,sel:[],pick:null,warn:false,selKey:'',
     flipKey:'',flipRunning:false,copied:false,copyFail:false,err:''};
  mode='online';
  try{localStorage.setItem('rd_code',code);localStorage.setItem('rd_name',OL.name);O.seenGid=localStorage.getItem('rd_seen_'+code)||null;}catch(e){}
  var db=OL.db,base='games/'+code;
  var onErr=function(e){
    if(!O||O.code!==code)return;
    if(e&&e.code==='revoked'){closeSession('Você perdeu o acesso a esta partida.');return;}
    O.err='Sinal instável. Aguarde um instante.';softRender();
  };
  O.unsubs.push(db.doc(base).onSnapshot(function(s){
    if(!O||O.code!==code)return;
    if(!s.exists){closeSession('Esse sinal se apagou: a partida não existe mais.');return;}
    O.game=normG(clone(s.data()));O.ready=true;O.err='';onGameChange();
  },onErr));
  O.unsubs.push(db.collection(base+'/players').onSnapshot(function(q){
    if(!O||O.code!==code)return;
    O.players=q.docs.map(function(d){return d.data();}).sort(byJoined);softRender();hostTick();
  },onErr));
  O.unsubs.push(db.collection(base+'/intents').onSnapshot(function(q){
    if(!O||O.code!==code)return;
    var m={};q.docs.forEach(function(d){m[d.id]=d.data();});O.intents=m;softRender();hostTick();
  },onErr));
  if(isHost){
    O.unsubs.push(db.collection(base+'/cards').onSnapshot(function(q){
      if(!O||O.code!==code)return;
      O.cards=q.docs.map(function(d){return d.data();});hostTick();
    },onErr));
    O.unsubs.push(db.collection(base+'/roles').onSnapshot(function(q){
      if(!O||O.code!==code)return;
      var m={};q.docs.forEach(function(d){m[d.id]=d.data();});O.allRoles=m;O.myRole=m[OL.id]||null;onGameChange();
    },onErr));
  }else{
    O.unsubs.push(db.doc(base+'/roles/'+OL.id).onSnapshot(function(s){
      if(!O||O.code!==code)return;
      O.myRole=s.exists?s.data():null;onGameChange();
    },onErr));
  }
  render();
}
function onGameChange(){
  var g=O.game;
  if(g&&g.phase!=='lobby'&&O.myRole&&O.myRole.gid===g.gid&&O.seenGid!==g.gid){
    O.seenGid=g.gid;O.showRole=true;
    if(!O.introShown){O.introShown=true;introOpen(null,'Ver meu papel');}
    try{localStorage.setItem('rd_seen_'+O.code,g.gid);}catch(e){}
  }
  softRender();hostTick();
}
function leaveSession(){
  if(!O)return;
  var code=O.code,lobbyPlayer=O.game&&O.game.phase==='lobby'&&!O.isHost;
  O.unsubs.forEach(function(u){try{u();}catch(e){}});
  O=null;
  try{localStorage.removeItem('rd_code');}catch(e){}
  if(lobbyPlayer&&OL.db)OL.db.doc('games/'+code+'/players/'+OL.id).delete().catch(function(){});
}
function closeSession(msg){leaveSession();OL.msg=msg;softRender();}

/* operador: único que avança a partida */
function hostSet(next){
  O.busy=true;
  return OL.db.doc('games/'+O.code).set(next).then(function(){
    if(!O)return;
    O.busy=false;O.retries=0;O.err='';O.game=normG(clone(next));softRender();setTimeout(hostTick,0);
  }).catch(function(){
    if(!O)return;
    O.busy=false;O.retries++;
    if(O.retries<4){setTimeout(hostTick,1500);}
    else{O.err='Sinal perdido ao registrar a jogada. Confira a conexão e toque em Continuar de novo.';softRender();}
  });
}
function hostStart(plist,assassin,story){
  if(!O||!O.isHost||O.busy)return;
  var n=plist.length;
  if(n<5||n>10)return;
  var seen={};
  var ps=plist.map(function(p,i){
    var b=(p.name||'').trim()||('Agente '+(i+1)),k=b,c=2;
    while(seen[k.toLowerCase()]){k=b+' '+c;c++;}
    seen[k.toLowerCase()]=1;return {id:p.id,name:k};
  });
  var sp=SPIES[n],roles=[],i;
  for(i=0;i<n-sp;i++)roles.push({team:'res',special:null});
  for(i=0;i<sp;i++)roles.push({team:'spy',special:null});
  if(assassin){roles[0].special='comandante';roles[n-sp].special='assassino';}
  roles=shuffle(roles);
  var gid=rnd(6,LOW),spyIds=[];
  roles.forEach(function(r,k){if(r.team==='spy')spyIds.push(ps[k].id);});
  O.busy=true;O.err='';
  var chain=Promise.resolve();
  ps.forEach(function(p,k){
    var r=roles[k];
    chain=chain.then(function(){
      return OL.db.doc('games/'+O.code+'/roles/'+p.id).set({gid:gid,team:r.team,special:r.special,spies:(r.team==='spy'||r.special==='comandante')?spyIds:[]});
    });
  });
  return chain.then(function(){
    var g={code:O.code,hostId:OL.id,phase:'team',assassin:!!assassin,story:story||0,gid:gid,created:Date.now(),players:ps,mission:0,attempt:0,rejects:0,leader:Math.floor(Math.random()*n),results:[],team:[],log:[],vres:null,mres:null,endInfo:null};
    return OL.db.doc('games/'+O.code).set(g).then(function(){
      if(!O)return;
      O.busy=false;O.game=normG(clone(g));softRender();
    });
  }).catch(function(){
    if(!O)return;
    O.busy=false;O.err='Sinal perdido ao começar a partida. Tente de novo.';softRender();
  });
}
function finishOnline(g,winner,reason){
  g.phase='end';
  var roles=g.players.map(function(p){
    var r=(O.allRoles&&O.allRoles[p.id])||{team:'res',special:null};
    return {id:p.id,team:r.team,special:r.special||null};
  });
  g.endInfo={winner:winner,reason:reason,roles:roles};
}
function hostTick(){
  if(!O||!O.isHost||O.busy||!O.game||!O.game.players||!O.game.players.length)return;
  var g=O.game,n=g.players.length,key=oKey(g),next=null;
  if(g.phase==='team'){
    var lid=g.players[g.leader].id,it=O.intents[lid];
    if(it&&it.phase==='team'&&it.key===key&&it.team&&it.team.length){
      var size=TEAMS[n][g.mission],ids=[];
      it.team.forEach(function(id){if(ids.indexOf(id)<0&&g.players.some(function(p){return p.id===id;}))ids.push(id);});
      if(ids.length===size){next=clone(g);next.team=ids;next.phase='vote';}
    }
  }else if(g.phase==='vote'){
    var votes={},cnt=0,ap=0;
    g.players.forEach(function(p){
      var v=O.intents[p.id];
      if(v&&v.phase==='vote'&&v.key===key&&(v.vote==='A'||v.vote==='R')){votes[p.id]=v.vote;cnt++;if(v.vote==='A')ap++;}
    });
    if(cnt===n){
      var rj=n-ap,ok=ap>rj;
      next=clone(g);next.vres={ap:ap,rj:rj,ok:ok,votes:votes};
      if(!ok)next.rejects++;
      next.log.push({m:g.mission,leader:g.players[g.leader].id,team:g.team.slice(),votes:votes,ap:ap,rj:rj,ok:ok,result:null});
      next.phase='voteResult';
    }
  }else if(g.phase==='mission'){
    var done=g.team.filter(function(id){var v=O.intents[id];return v&&v.phase==='mission'&&v.key===key&&v.done;}).length;
    if(done===g.team.length){
      var cs=O.cards.filter(function(c){return c.key===key;}).map(function(c){return c.card==='F'?'F':'S';});
      if(cs.length>=g.team.length){
        cs=shuffle(cs.slice(0,g.team.length));
        var fails=cs.filter(function(c){return c==='F';}).length,need=(n>=7&&g.mission===3)?2:1,ok2=fails<need;
        next=clone(g);next.results[g.mission]=ok2?'S':'F';
        next.log[next.log.length-1].result={succ:cs.length-fails,fail:fails,ok:ok2};
        next.mres={cards:cs,fails:fails,ok:ok2,need:need};next.phase='missionResult';
      }
    }
  }else if(g.phase==='assassin'&&O.allRoles){
    var aid=null,cid=null;
    g.players.forEach(function(p){
      var r=O.allRoles[p.id];
      if(r){if(r.special==='assassino')aid=p.id;if(r.special==='comandante')cid=p.id;}
    });
    var a=aid&&O.intents[aid];
    if(a&&a.phase==='assassin'&&a.key===key&&g.players.some(function(p){return p.id===a.pick;})){
      next=clone(g);
      if(a.pick===cid)finishOnline(next,'spy','O Assassino apontou '+oName(a.pick)+', e era mesmo o Comandante.');
      else finishOnline(next,'res','O Assassino apontou '+oName(a.pick)+', mas o Comandante era '+oName(cid)+'.');
    }
  }
  if(next)hostSet(next);
}
function hostContinue(){
  if(!O||!O.isHost||O.busy||!O.game)return;
  var g=clone(O.game),n=g.players.length;
  if(g.phase==='voteResult'){
    if(g.vres.ok){g.phase='mission';}
    else if(g.rejects>=5){finishOnline(g,'spy','Cinco equipes seguidas foram rejeitadas.');}
    else{g.leader=(g.leader+1)%n;g.team=[];g.attempt++;g.phase='team';g.vres=null;}
  }else if(g.phase==='missionResult'){
    var s=g.results.filter(function(r){return r==='S';}).length;
    var f=g.results.filter(function(r){return r==='F';}).length;
    if(s>=3){
      if(g.assassin)g.phase='assassin';
      else finishOnline(g,'res','Três missões foram cumpridas com sucesso.');
    }else if(f>=3){finishOnline(g,'spy','Três missões fracassaram.');}
    else{g.mission++;g.rejects=0;g.attempt=0;g.leader=(g.leader+1)%n;g.team=[];g.phase='team';g.mres=null;g.vres=null;}
  }else return;
  hostSet(g);
}

function ochips(ids){return '<ul class="chips">'+ids.map(function(id){return '<li class="chip">'+oN(id)+'</li>';}).join('')+'</ul>';}

function onlineView(){

function oMission(){

function oMissionResult(){

      G.log.push({m:G.mission,leader:G.leader,team:G.team.slice(),votes:JSON.parse(JSON.stringify(G.votes)),ap:ap,rj:rj,ok:ok,result:null});
      G.vres={ap:ap,rj:rj,ok:ok};
      if(!ok)G.rejects++;
      G.screen='voteResult';
    }else{G.vstage='hand';}
  },

    if(G.vres.ok){
      G.morder=G.order.filter(function(p){return G.team.indexOf(p)>-1;});
      G.mi=0;G.mstage='hand';G.cards=[];G.pick=null;G.warn=false;G.screen='mission';

      G.leader=(G.leader+1)%cfg.n;G.team=[];G.screen='team';

  },
  confirmCard:function(){
    if(!G.pick)return;
    G.cards.push(G.pick);G.pick=null;G.warn=false;G.mi++;
    if(G.mi>=G.morder.length){
      var cards=shuffle(G.cards),fails=cards.filter(function(c){return c==='F';}).length;
      var need=needFails(),ok=fails<need;
      G.results[G.mission]=ok?'S':'F';
      G.log[G.log.length-1].result={succ:cards.length-fails,fail:fails,ok:ok};
      G.mres={cards:cards,fails:fails,ok:ok,need:need};
      G.screen='missionResult';
    }else{G.mstage='hand';}
  },
  afterMission:function(){
    var s=G.results.filter(function(r){return r==='S';}).length;
    var f=G.results.filter(function(r){return r==='F';}).length;
    if(s>=3){
      if(cfg.assassin){G.apick=null;G.screen='assassin';}

      endGame('spy','Três missões fracassaram.');
    }else{
      G.mission++;G.rejects=0;G.leader=(G.leader+1)%cfg.n;G.team=[];G.screen='team';
    }
  },
  pickAssassin:function(i){G.apick=i;},
  confirmAssassin:function(){
    if(G.apick===null)return;
    var cmd=-1;G.roles.forEach(function(r,k){if(r.special==='comandante')cmd=k;});

  },
  again:function(){startGame();},
  toSetup:function(){G=null;}
};

var MUS={on:true,started:false,want:'lobby',cur:null,tr:{lobby:{src:'media/covert-meeting.mp3',audio:null,fade:null},match:{src:'media/covert-meeting-1.mp3',audio:null,fade:null}}};
try{if(localStorage.getItem('rd_music')==='0')MUS.on=false;}catch(e){}
var ICON_SND='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
var ICON_MUTE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function musUI(){
  var b=document.getElementById('mus');if(!b)return;
  b.innerHTML=MUS.on?ICON_SND:ICON_MUTE;
  b.className=MUS.on?'':'off';
  b.setAttribute('aria-pressed',MUS.on?'true':'false');
  b.setAttribute('aria-label',MUS.on?'Desligar a música':'Ligar a música');
}
var MUS_VOL=.55;
var MUS_XF=2200;
function musFade(t,to,ms,done){
  var a=t.audio;if(!a)return;
  if(t.fade)clearInterval(t.fade);
  var from=a.volume,steps=Math.max(1,Math.round(ms/50)),i=0;
  t.fade=setInterval(function(){
    i++;a.volume=Math.max(0,Math.min(1,from+(to-from)*i/steps));
    if(i>=steps){clearInterval(t.fade);t.fade=null;if(done)done();}
  },50);
}
function musTrack(name){
  var t=MUS.tr[name];
  if(!t.audio&&typeof Audio!=='undefined'){t.audio=new Audio(t.src);t.audio.loop=true;t.audio.preload='auto';t.audio.volume=0;}
  return t;
}
/* entra a faixa pedida e sai a outra, as duas se cruzando */
function musCross(name,ms){
  var nt=musTrack(name);if(!nt.audio)return;
  var prev=MUS.cur;MUS.cur=name;
  var pr=nt.audio.play();if(pr&&pr.catch)pr.catch(function(){});
  musFade(nt,MUS_VOL,ms);
  Object.keys(MUS.tr).forEach(function(k){
    if(k===name)return;
    var ot=MUS.tr[k];if(!ot.audio)return;
    musFade(ot,0,ms,function(){if(MUS.cur!==k)ot.audio.pause();});
  });
}
function musPlay(){
  if(typeof Audio==='undefined')return;
  MUS.started=true;
  musCross(MUS.want,1200);
}
function musStop(){
  Object.keys(MUS.tr).forEach(function(k){
    var t=MUS.tr[k];if(!t.audio)return;
    musFade(t,0,900,function(){if(!MUS.on)t.audio.pause();});
  });
}
/* a música da partida só entra quando a partida começa */
function matchOn(){return !intro.on&&!pick.on&&!!((G&&G.screen)||(O&&O.game&&O.game.phase&&O.game.phase!=='lobby'));}
function musSync(){
  var w=matchOn()?'match':'lobby';
  if(MUS.want===w)return;
  MUS.want=w;
  if(MUS.started&&MUS.on)musCross(w,MUS_XF);
}
var musBtn=document.getElementById('mus');
if(musBtn){
  musUI();
  musBtn.addEventListener('click',function(){
    MUS.on=!MUS.on;
    try{localStorage.setItem('rd_music',MUS.on?'1':'0');}catch(e){}
    musUI();
    if(MUS.on)musPlay();else musStop();
  });
  var musFirst=function(e){
    if(MUS.started||!MUS.on)return;
    if(e&&e.target&&e.target.closest&&e.target.closest('#mus'))return;
    musPlay();
  };
  window.addEventListener('pointerdown',musFirst);
  window.addEventListener('keydown',musFirst);
  document.addEventListener('visibilitychange',function(){
    var t=MUS.cur&&MUS.tr[MUS.cur],a=t&&t.audio;if(!a||!MUS.on)return;
    if(document.hidden)a.pause();else{var pr=a.play();if(pr&&pr.catch)pr.catch(function(){});}
  });
}


/* tela de "sinal apagado" ao esconder um segredo antes de passar o aparelho */
function seal(){
  try{
    var old=document.getElementById('seal');if(old&&old.parentNode)old.parentNode.removeChild(old);
    var d=document.createElement('div');d.id='seal';d.setAttribute('aria-hidden','true');
    d.innerHTML=ICON_LOCK+'<b>SINAL APAGADO</b><small>Passe o aparelho</small>';
    document.body.appendChild(d);
    sfx('seal');
    setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},960);
  }catch(e){}
}
/* vibração (Android; o iPhone não permite) */
var VIB={tap:6,yes:12,no:[25,30,25],inc:8,dec:8,pick:8,flip:10,ok:[40,60,40,60,90],bad:[150,60,150,60,300],win:[60,50,60,50,60,50,250],lose:[400,100,200],seal:45,unlock:[15,40,25],armOn:[20,40,50],armOff:15,local:15,online:[20,40,20]};

/* efeitos sonoros sintetizados (independentes do botão de música) */
var SFXC=null;
function sfxCtx(){
  if(SFXC)return SFXC;
  try{var C=window.AudioContext||window.webkitAudioContext;if(C)SFXC=new C();}catch(e){}
  return SFXC;
}
function sfxTone(c,t,f,d,type,vol,f2){
  var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.02);
}
function sfxNoise(c,t,d,vol,fq){
  var n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(var i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
  var s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
  s.buffer=b;f.type='bandpass';f.frequency.value=fq||1800;g.gain.value=vol;
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);
}
function sfx(k){
  try{if(VIB[k]&&navigator.vibrate)navigator.vibrate(VIB[k]);}catch(e){}
  var c=sfxCtx();if(!c)return;
  try{
    if(c.state==='suspended')c.resume();
    var t=c.currentTime+0.01,i;
    if(k==='tap'){sfxTone(c,t,1300,0.05,'square',0.05,900);}
    else if(k==='yes'){sfxTone(c,t,660,0.09,'triangle',0.12);sfxTone(c,t+0.07,990,0.16,'triangle',0.12);}
    else if(k==='no'){sfxTone(c,t,200,0.2,'sawtooth',0.09,90);sfxNoise(c,t,0.12,0.08,700);}
    else if(k==='armOn'){sfxTone(c,t,180,0.12,'square',0.06);sfxTone(c,t+0.1,360,0.1,'square',0.06);sfxTone(c,t+0.2,1100,0.25,'triangle',0.1);sfxNoise(c,t+0.2,0.08,0.05,3000);}
    else if(k==='armOff'){sfxTone(c,t,900,0.1,'triangle',0.08,500);sfxTone(c,t+0.09,300,0.18,'square',0.05,150);}
    else if(k==='seal'){sfxNoise(c,t,0.05,0.12,2500);sfxTone(c,t+0.04,140,0.25,'sine',0.2,70);sfxTone(c,t+0.3,300,0.05,'square',0.05);}
    else if(k==='unlock'){sfxNoise(c,t,0.04,0.08,3500);sfxTone(c,t+0.05,600,0.06,'square',0.05);sfxTone(c,t+0.12,900,0.1,'square',0.05);}
    else if(k==='inc'){sfxTone(c,t,520,0.06,'square',0.05);sfxTone(c,t+0.05,780,0.09,'square',0.05);}
    else if(k==='dec'){sfxTone(c,t,780,0.06,'square',0.05);sfxTone(c,t+0.05,520,0.09,'square',0.05);}
    else if(k==='pick'){sfxTone(c,t,880,0.05,'triangle',0.09);}
    else if(k==='local'){sfxTone(c,t,300,0.08,'square',0.05);sfxTone(c,t+0.07,450,0.1,'square',0.05);sfxNoise(c,t,0.06,0.04,2500);}
    else if(k==='online'){sfxTone(c,t,400,0.35,'sine',0.11,1500);sfxTone(c,t+0.28,1500,0.5,'sine',0.07);sfxTone(c,t+0.28,1503,0.5,'sine',0.05);sfxNoise(c,t,0.25,0.04,3500);}
    else if(k==='flip'){sfxNoise(c,t,0.06,0.07,3000);sfxTone(c,t,520,0.07,'sine',0.07,260);}
    else if(k==='ok'){[523,659,784,1047].forEach(function(f,j){sfxTone(c,t+j*0.1,f,0.5,'triangle',0.13);sfxTone(c,t+j*0.1,f*2,0.3,'sine',0.04);});}
    else if(k==='bad'){sfxNoise(c,t,0.35,0.2,900);sfxTone(c,t,220,0.5,'sawtooth',0.12,70);sfxTone(c,t+0.05,233,0.5,'square',0.06,65);sfxTone(c,t+0.35,110,0.6,'sine',0.14,55);}
    else if(k==='win'){[392,523,659,784,1047].forEach(function(f,j){sfxTone(c,t+j*0.13,f,0.9,'triangle',0.13);});sfxTone(c,t+0.7,523,1.6,'sine',0.1);sfxTone(c,t+0.7,784,1.6,'sine',0.08);sfxTone(c,t+0.7,1047,1.6,'sine',0.06);}
    else if(k==='lose'){for(i=0;i<4;i++)sfxTone(c,t+i*0.04,196*Math.pow(1.06,i),1.4,'sawtooth',0.05,60);sfxNoise(c,t,0.5,0.2,600);sfxTone(c,t+0.5,98,1.6,'sine',0.16,41);}
  }catch(e){}
}
if(document.addEventListener){
  document.addEventListener('pointerdown',function(e){
    var b=e.target&&e.target.closest?e.target.closest('.btn,.big,.stepper button,.tab,.pbtn,.scard'):null;
    if(!b||b.disabled)return;
    if(b.dataset&&(b.dataset.a==='showRole'||b.dataset.a==='showVote'||b.dataset.a==='showMission')){sfx('unlock');return;}
    if(b.id==='inc'){sfx('inc');return;}
    if(b.id==='dec'){sfx('dec');return;}
    if(b.classList.contains('tab')){if(!b.classList.contains('on'))sfx(b.dataset.v==='online'?'online':'local');return;}
    if(b.classList.contains('pbtn')||b.classList.contains('scard')){sfx('pick');return;}
    sfx(b.classList.contains('big')?(b.classList.contains('no')?'no':'yes'):'tap');
  },true);
  document.addEventListener('change',function(e){
    var t=e.target;if(!t||(t.id!=='assassin'&&t.id!=='oassassin'))return;
    sfx(t.checked?'armOn':'armOff');
  },true);
  document.addEventListener('animationstart',function(e){
    var el=e.target;if(!el||!el.closest||e.animationName!=='stamp')return;
    var v=el.closest('.verdict'),bn=el.closest('.banner');
    if(v)sfx(v.classList.contains('ok')?'ok':'bad');
    else if(bn)sfx(bn.classList.contains('res')?'win':'lose');
  },true);
}

/* inclinação 3D que segue o dedo ou o mouse */
function tiltTarget(e){return e.target&&e.target.closest?e.target.closest('.role,.banner'):null;}
function tiltMove(e){
  var el=tiltTarget(e);if(!el)return;
  var r=el.getBoundingClientRect();if(!r.width||!r.height)return;
  var px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
  el.style.setProperty('--ry',((px-.5)*16).toFixed(1)+'deg');
  el.style.setProperty('--rx',((.5-py)*16).toFixed(1)+'deg');
  el.style.setProperty('--gx',(px*100).toFixed(0)+'%');
  el.style.setProperty('--gy',(py*100).toFixed(0)+'%');
}
function tiltReset(e){
  var el=tiltTarget(e);if(!el)return;
  ['--rx','--ry','--gx','--gy'].forEach(function(k){el.style.removeProperty(k);});
}
app.addEventListener('pointermove',tiltMove);
app.addEventListener('pointerdown',tiltMove);
app.addEventListener('pointerup',tiltReset);
app.addEventListener('pointerleave',tiltReset);
app.addEventListener('pointercancel',tiltReset);

/* ondulação ao tocar nos botões */
if(document.addEventListener)document.addEventListener('pointerdown',function(e){
  var b=e.target&&e.target.closest?e.target.closest('.btn,.big'):null;
  if(!b||b.disabled)return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var r=b.getBoundingClientRect(),d=document.createElement('span');
  d.className='rip';d.style.left=(e.clientX-r.left)+'px';d.style.top=(e.clientY-r.top)+'px';
  b.appendChild(d);setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},650);
},true);

/* vídeo da caixinha: roda no hover (mouse) ou quando a história está escolhida (celular) */
function svidSet(v,on){
  if(!v)return;
  if(on){v.classList.add('live');var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});}
  else{v.classList.remove('live');try{v.pause();}catch(e){}}
}
function svidSync(){
  var vs=document.querySelectorAll?document.querySelectorAll('.svid'):[];
  for(var i=0;i<vs.length;i++){var c=vs[i].closest('.scard');svidSet(vs[i],!!(c&&c.classList.contains('on')));}
}
if(document.addEventListener){
  document.addEventListener('mouseover',function(e){var c=e.target&&e.target.closest?e.target.closest('.scard'):null;if(c)svidSet(c.querySelector('.svid'),true);});
  document.addEventListener('mouseout',function(e){var c=e.target&&e.target.closest?e.target.closest('.scard'):null;if(c&&!c.classList.contains('on')&&!(e.relatedTarget&&c.contains(e.relatedTarget)))svidSet(c.querySelector('.svid'),false);});
}

render();
initOnline().then(afterInit);
})();
